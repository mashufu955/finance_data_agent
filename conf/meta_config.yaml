tables:
  # ---- 维度表 ----
  - name: dim_branch
    role: dim
    description: 网点维度表，记录银行各营业网点信息。
    columns:
      - name: id
        role: primary_key
        description: 网点自增主键ID。其他表通过branch_id引用此字段。
        alias: [ 网点ID, 网点主键 ]
        sync: false
      - name: branch_code
        role: dimension
        description: 网点编码，业务唯一标识。
        alias: [ 网点编号, 网点代码 ]
        sync: true
      - name: branch_name
        role: dimension
        description: 网点名称。
        alias: [ 网点名称, 支行名称 ]
        sync: true
      - name: province
        role: dimension
        description: 网点所属省份。
        alias: [ 省份, 所在省份 ]
        sync: true
      - name: city
        role: dimension
        description: 网点所属城市。
        alias: [ 城市, 所在城市 ]
        sync: true

  - name: dim_channel
    role: dim
    description: 渠道维度表，记录业务办理渠道信息。
    columns:
      - name: id
        role: primary_key
        description: 渠道自增主键ID。其他表通过channel_id引用此字段。
        alias: [ 渠道ID, 渠道主键 ]
        sync: false
      - name: channel_code
        role: dimension
        description: 渠道编码，业务唯一标识。
        alias: [ 渠道编号, 渠道代码 ]
        sync: true
      - name: channel_name
        role: dimension
        description: 渠道名称。
        alias: [ 渠道名称 ]
        sync: true

  - name: dim_currency
    role: dim
    description: 币种维度表。
    columns:
      - name: id
        role: primary_key
        description: 币种自增主键ID。
        alias: [ 币种ID, 币种主键 ]
        sync: false
      - name: currency_code
        role: dimension
        description: 币种编码，如CNY、USD。
        alias: [ 币种编码, 币种 ]
        sync: true
      - name: currency_name
        role: dimension
        description: 币种名称。
        alias: [ 币种名称 ]
        sync: true

  - name: dim_employee
    role: dim
    description: 员工维度表，记录银行员工信息。
    columns:
      - name: id
        role: primary_key
        description: 员工自增主键ID。其他表通过operator_id等引用此字段。
        alias: [ 员工ID, 员工主键 ]
        sync: false
      - name: employee_no
        role: dimension
        description: 员工编号。
        alias: [ 员工编号, 工号 ]
        sync: true
      - name: employee_name
        role: dimension
        description: 员工姓名。
        alias: [ 员工姓名, 姓名 ]
        sync: true
      - name: employee_role
        role: dimension
        description: 员工角色。
        alias: [ 角色, 职位 ]
        sync: true
      - name: employee_status
        role: dimension
        description: 员工状态。
        alias: [ 员工状态, 状态 ]
        sync: true

  - name: dim_product_category
    role: dim
    description: 产品类别维度表。
    columns:
      - name: id
        role: primary_key
        description: 类别自增主键ID。其他表通过category_id引用此字段。
        alias: [ 类别ID, 类别主键 ]
        sync: false
      - name: category_code
        role: dimension
        description: 产品类别编码。
        alias: [ 类别编码, 产品分类 ]
        sync: true
      - name: category_name
        role: dimension
        description: 产品类别名称。
        alias: [ 类别名称, 产品分类名称 ]
        sync: true

  # ---- 产品表 ----
  - name: account_product
    role: dim
    description: 账户产品表，定义银行账户类产品配置。
    columns:
      - name: id
        role: primary_key
        description: 账户产品自增主键ID。bank_account.account_product_id引用此字段。
        alias: [ 账户产品ID, 账户产品主键 ]
        sync: false
      - name: product_code
        role: dimension
        description: 账户产品编码。
        alias: [ 账户产品编码 ]
        sync: true
      - name: product_name
        role: dimension
        description: 账户产品名称。
        alias: [ 账户产品名称 ]
        sync: true
      - name: product_status
        role: dimension
        description: 产品状态，如active/inactive。
        alias: [ 产品状态 ]
        sync: true

  - name: loan_product
    role: dim
    description: 贷款产品表，定义贷款类产品配置。
    columns:
      - name: id
        role: primary_key
        description: 贷款产品自增主键ID。loan_application.product_id和credit_application.product_id引用此字段。
        alias: [ 贷款产品ID, 贷款产品主键 ]
        sync: false
      - name: product_code
        role: dimension
        description: 贷款产品编码。
        alias: [ 贷款产品编码 ]
        sync: true
      - name: product_name
        role: dimension
        description: 贷款产品名称。
        alias: [ 贷款产品名称 ]
        sync: true
      - name: annual_interest_rate
        role: measure
        description: 年化利率。
        alias: [ 年利率, 利率 ]
        sync: false

  - name: wealth_product
    role: dim
    description: 理财产品表，定义银行理财类产品配置。
    columns:
      - name: id
        role: primary_key
        description: 理财产品自增主键ID。wealth_order.product_id引用此字段。
        alias: [ 理财产品ID, 理财产品主键 ]
        sync: false
      - name: product_code
        role: dimension
        description: 理财产品编码。
        alias: [ 理财产品编码 ]
        sync: true
      - name: product_name
        role: dimension
        description: 理财产品名称。
        alias: [ 理财产品名称 ]
        sync: true
      - name: risk_level_id
        role: dimension
        description: 风险等级ID，关联dim_risk_level。
        alias: [ 风险等级, 产品风险 ]
        sync: true

  # ---- 核心业务表 ----
  - name: customer
    role: fact
    description: 客户主表，记录银行客户基本信息。
    columns:
      - name: id
        role: primary_key
        description: 客户自增主键ID。其他表通过customer_id引用此字段。
        alias: [ 客户ID, 客户主键 ]
        sync: false
      - name: customer_no
        role: dimension
        description: 客户编号，业务唯一标识。
        alias: [ 客户编号, 客户号 ]
        sync: true
      - name: customer_name
        role: dimension
        description: 客户名称。
        alias: [ 客户名称, 姓名 ]
        sync: true
      - name: customer_type
        role: dimension
        description: 客户类型，personal/enterprise。
        alias: [ 客户类型, 类型 ]
        sync: true
      - name: customer_status
        role: dimension
        description: 客户状态，如active/inactive。
        alias: [ 客户状态, 状态 ]
        sync: true
      - name: branch_id
        role: foreign_key
        description: 所属网点ID，关联dim_branch.id。
        alias: [ 所属网点 ]
        sync: false

  - name: bank_account
    role: fact
    description: 银行账户表，记录客户开立的银行账户信息。
    columns:
      - name: id
        role: primary_key
        description: 账户自增主键ID。其他表通过account_id/from_account_id/to_account_id引用此字段。
        alias: [ 账户ID, 账户主键 ]
        sync: false
      - name: account_no
        role: dimension
        description: 账户编号，业务唯一标识。
        alias: [ 账户编号, 账号 ]
        sync: true
      - name: customer_id
        role: foreign_key
        description: 关联客户ID，关联customer.id。
        alias: [ 客户ID ]
        sync: false
      - name: branch_id
        role: foreign_key
        description: 开户网点ID，关联dim_branch.id。
        alias: [ 开户网点ID, 网点ID ]
        sync: false
      - name: account_product_id
        role: foreign_key
        description: 账户产品ID，关联account_product.id。
        alias: [ 产品ID ]
        sync: false
      - name: balance_amount
        role: measure
        description: 账户余额。
        alias: [ 余额, 账户余额 ]
        sync: false
      - name: currency_code
        role: dimension
        description: 币种编码。
        alias: [ 币种 ]
        sync: true
      - name: account_status
        role: dimension
        description: 账户状态。
        alias: [ 账户状态 ]
        sync: true

  - name: account_transaction
    role: fact
    description: 账户交易流水表，记录每笔账户交易明细。
    columns:
      - name: id
        role: primary_key
        description: 交易自增主键ID。
        alias: [ 交易ID, 交易主键 ]
        sync: false
      - name: transaction_no
        role: dimension
        description: 交易流水号，业务唯一标识。
        alias: [ 交易流水号, 交易编号 ]
        sync: true
      - name: from_account_id
        role: foreign_key
        description: 付款账户ID，关联bank_account.id。
        alias: [ 付款账户 ]
        sync: false
      - name: to_account_id
        role: foreign_key
        description: 收款账户ID，关联bank_account.id。
        alias: [ 收款账户 ]
        sync: false
      - name: customer_id
        role: foreign_key
        description: 关联客户ID，关联customer.id。
        alias: [ 客户ID ]
        sync: false
      - name: transaction_type
        role: dimension
        description: 交易类型，如deposit/withdraw/transfer。
        alias: [ 交易类型, 类型 ]
        sync: true
      - name: transaction_amount
        role: measure
        description: 交易金额。
        alias: [ 交易金额, 金额 ]
        sync: false
      - name: currency_code
        role: dimension
        description: 币种编码。
        alias: [ 币种 ]
        sync: true
      - name: transaction_at
        role: dimension
        description: 交易时间。
        alias: [ 交易时间, 交易日期 ]
        sync: false
      - name: channel_id
        role: foreign_key
        description: 交易渠道ID，关联dim_channel.id。
        alias: [ 渠道ID, 交易渠道ID ]
        sync: false

  - name: loan_application
    role: fact
    description: 贷款申请表，记录客户贷款申请信息。
    columns:
      - name: id
        role: primary_key
        description: 贷款申请自增主键ID。其他表通过application_id引用此字段。
        alias: [ 申请ID, 申请主键 ]
        sync: false
      - name: application_no
        role: dimension
        description: 申请编号，业务唯一标识。
        alias: [ 申请编号, 贷款申请号 ]
        sync: true
      - name: customer_id
        role: foreign_key
        description: 关联客户ID，关联customer.id。
        alias: [ 客户ID ]
        sync: false
      - name: product_id
        role: foreign_key
        description: 贷款产品ID，关联loan_product.id。
        alias: [ 产品ID ]
        sync: false
      - name: apply_amount
        role: measure
        description: 申请金额。
        alias: [ 申请金额, 贷款金额 ]
        sync: false
      - name: apply_term_months
        role: dimension
        description: 申请期数（月）。
        alias: [ 申请期数, 贷款期限 ]
        sync: false
      - name: application_status
        role: dimension
        description: 申请状态。
        alias: [ 申请状态, 状态 ]
        sync: true

  - name: loan_contract
    role: fact
    description: 贷款合同表，记录已放款的贷款合同信息。
    columns:
      - name: id
        role: primary_key
        description: 合同自增主键ID。其他表通过contract_id引用此字段。
        alias: [ 合同ID, 合同主键 ]
        sync: false
      - name: contract_no
        role: dimension
        description: 合同编号，业务唯一标识。
        alias: [ 合同编号, 贷款合同号 ]
        sync: true
      - name: application_id
        role: foreign_key
        description: 关联申请ID，关联loan_application.id。
        alias: [ 申请ID ]
        sync: false
      - name: customer_id
        role: foreign_key
        description: 关联客户ID，关联customer.id。
        alias: [ 客户ID ]
        sync: false
      - name: principal_amount
        role: measure
        description: 合同本金金额。
        alias: [ 合同金额, 贷款金额, 本金 ]
        sync: false
      - name: outstanding_principal_amount
        role: measure
        description: 未还本金金额。
        alias: [ 未还本金, 剩余本金 ]
        sync: false
      - name: contract_status
        role: dimension
        description: 合同状态。
        alias: [ 合同状态, 状态 ]
        sync: true

  - name: repayment_bill
    role: fact
    description: 还款账单表，记录贷款还款计划及执行情况。
    columns:
      - name: id
        role: primary_key
        description: 账单自增主键ID。其他表通过bill_id引用此字段。
        alias: [ 账单ID, 账单主键 ]
        sync: false
      - name: bill_no
        role: dimension
        description: 账单编号，业务唯一标识。
        alias: [ 账单编号, 还款账单号 ]
        sync: true
      - name: contract_id
        role: foreign_key
        description: 关联合同ID，关联loan_contract.id。
        alias: [ 合同ID ]
        sync: false
      - name: customer_id
        role: foreign_key
        description: 关联客户ID，关联customer.id。
        alias: [ 客户ID ]
        sync: false
      - name: principal_amount
        role: measure
        description: 应还本金。
        alias: [ 本金, 应还本金 ]
        sync: false
      - name: interest_amount
        role: measure
        description: 应还利息。
        alias: [ 利息, 应还利息 ]
        sync: false
      - name: outstanding_amount
        role: measure
        description: 未还金额。
        alias: [ 未还金额, 剩余金额 ]
        sync: false
      - name: bill_status
        role: dimension
        description: 账单状态。
        alias: [ 账单状态, 状态 ]
        sync: true
      - name: due_date
        role: dimension
        description: 到期日。
        alias: [ 到期日, 还款日 ]
        sync: false

  - name: credit_application
    role: fact
    description: 授信申请表，记录客户授信申请信息。
    columns:
      - name: id
        role: primary_key
        description: 授信申请自增主键ID。
        alias: [ 授信ID, 授信主键 ]
        sync: false
      - name: credit_application_no
        role: dimension
        description: 授信申请编号，业务唯一标识。
        alias: [ 授信申请编号, 授信编号 ]
        sync: true
      - name: customer_id
        role: foreign_key
        description: 关联客户ID，关联customer.id。
        alias: [ 客户ID ]
        sync: false
      - name: product_id
        role: foreign_key
        description: 贷款产品ID，关联loan_product.id。
        alias: [ 产品ID ]
        sync: false
      - name: apply_limit_amount
        role: measure
        description: 申请授信金额。
        alias: [ 授信金额, 申请金额 ]
        sync: false
      - name: application_status
        role: dimension
        description: 申请状态。
        alias: [ 申请状态, 状态 ]
        sync: true

  - name: wealth_order
    role: fact
    description: 理财订单表，记录客户购买/赎回理财产品的交易。
    columns:
      - name: id
        role: primary_key
        description: 订单自增主键ID。
        alias: [ 订单ID, 订单主键 ]
        sync: false
      - name: order_no
        role: dimension
        description: 订单编号，业务唯一标识。
        alias: [ 理财订单号, 订单编号 ]
        sync: true
      - name: customer_id
        role: foreign_key
        description: 关联客户ID，关联customer.id。
        alias: [ 客户ID ]
        sync: false
      - name: product_id
        role: foreign_key
        description: 理财产品ID，关联wealth_product.id。
        alias: [ 产品ID ]
        sync: false
      - name: account_id
        role: foreign_key
        description: 关联账户ID，关联bank_account.id。
        alias: [ 账户ID ]
        sync: false
      - name: order_type
        role: dimension
        description: 订单类型，purchase/redeem。
        alias: [ 订单类型, 类型 ]
        sync: true
      - name: order_amount
        role: measure
        description: 订单金额。
        alias: [ 金额, 订单金额 ]
        sync: false
      - name: order_status
        role: dimension
        description: 订单状态。
        alias: [ 订单状态, 状态 ]
        sync: true
      - name: channel_id
        role: foreign_key
        description: 交易渠道ID，关联dim_channel.id。
        alias: [ 渠道ID ]
        sync: false

metrics:
  - name: 存款余额
    description: 所有银行账户账户余额的总和。
    relevant_columns:
      - bank_account.balance_amount
    alias: [ 总存款, 存款总额 ]

  - name: 交易总额
    description: 所有账户交易的金额总和。
    relevant_columns:
      - account_transaction.transaction_amount
    alias: [ 总交易额, 交易金额合计 ]

  - name: 贷款余额
    description: 所有贷款合同的未还本金金额总和。
    relevant_columns:
      - loan_contract.outstanding_principal_amount
    alias: [ 未还贷款, 贷款剩余 ]

  - name: 客户数
    description: 银行客户总数。
    relevant_columns:
      - customer.customer_no
    alias: [ 客户总数, 总客户数 ]

  - name: 理财规模
    description: 所有理财订单的购买金额总和。
    relevant_columns:
      - wealth_order.order_amount
    alias: [ 理财总额, AUM ]
